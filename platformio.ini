[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Module is an N16R8: 16 MB quad flash + 8 MB octal PSRAM. The board default is
; 8 MB / no PSRAM, so these are required to match the actual hardware.
;
; Flash size MUST be set via board_upload.*, not board_build.flash_size — the
; latter is ignored, leaving 8 MB in the bootloader image header. A 16 MB
; partition table against an 8 MB header makes the second-stage bootloader
; reject the table and reset, which boot-loops the board ~34x/sec before it
; prints anything.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; The board has two Type-C ports. Serial goes out the UART one (CH343 bridge ->
; UART0), so CDC_ON_BOOT stays 0. Set it to 1 only if the cable moves to the
; native USB port, which enumerates separately as VID 303A.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    ; Lets modules include each other by path from the src root, e.g.
    ; #include "components/led/led.h", rather than by fragile relative paths.
    -I src

; Machine-specific: the CH343 bridge on this PC. Also has a legacy ACPI COM1,
; so name the port rather than letting auto-detect choose. Change on another PC.
monitor_port = COM3
upload_port = COM3

; --- Tests -------------------------------------------------------------------
; Two tiers. Pure logic runs on the host in milliseconds and needs no board;
; anything touching a peripheral runs on the board itself.
;
;   pio test -e native   fast, no hardware, safe for CI
;   pio test -e target   requires the board on COM3
;
; Host tier. Compiles only the Arduino-free sources, so it stays buildable on
; any machine with gcc. debounce.h is header-only and needs nothing compiled.
[env:native]
platform = native
test_filter = test_native_*
test_build_src = yes
build_src_filter = +<components/wifi/web_server/status_json.cpp>
build_flags = -I src -std=c++17

; On-target tier. main.cpp is excluded because its setup()/loop() would collide
; with the test runner's.
[env:target]
extends = env:esp32-s3-devkitc-1
test_filter = test_embedded_*
test_build_src = yes
build_src_filter = +<*> -<main.cpp>

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Module is an N16R8: 16 MB quad flash + 8 MB octal PSRAM. The board default is
; 8 MB / no PSRAM, so these are required to match the actual hardware.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv

; ESP32-S3 uses native USB CDC, so Serial needs these to appear over the USB port
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

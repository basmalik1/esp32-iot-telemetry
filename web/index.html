<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline data URI rather than a file: the board serves exactly one
         asset, so a linked favicon would cost an extra request that 404s on
         every page load - and the server handles one request at a time. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2322c55e'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>esp32-iot-telemetry</title>
    <script>
      // Runs before React mounts, so a dark-mode visitor never sees a white
      // flash while the bundle parses. The app reads the same key afterwards.
      try {
        var t = localStorage.getItem("theme")
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light"
        }
        if (t === "dark") document.documentElement.classList.add("dark")
        document.documentElement.style.colorScheme = t
      } catch (e) {
        /* no persisted preference available; the app falls back on its own */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
